{% extends 'atendimento/base.html' %}

{% block content %}
    <div class="cabecalho-pagina">
        <div>
            <h1>Serviços</h1>
            <p class="subtitulo">Catálogo do PetCare</p>
        </div>
        <a class="botao" href="{% url 'novo_servico' %}">Novo serviço</a>
    </div>

    <div class="cartao tabela">
        <table>
            <thead>
                <tr>
                    <th>Serviço</th>
                    <th>Preço</th>
                    <th class="acoes"></th>
                </tr>
            </thead>
            <tbody>
                {% for servico in servicos %}
                    <tr>
                        <td>{{ servico.nome }}</td>
                        <td>R$ {{ servico.preco|floatformat:2 }}</td>
                        <td class="acoes">
                            <a class="botao botao-fantasma botao-pequeno" href="{% url 'editar_servico' servico.pk %}">Editar</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3" class="vazio">Nenhum serviço cadastrado.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
