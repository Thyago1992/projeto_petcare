{% extends 'atendimento/base.html' %}

{% block content %}
    <div class="centro">
        <h1>Entrar</h1>
        <div class="cartao formulario">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="botao">Entrar</button>
            </form>
            <p class="rodape-formulario">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
        </div>
    </div>
{% endblock %}
