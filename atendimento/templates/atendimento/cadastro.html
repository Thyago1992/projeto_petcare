{% extends 'atendimento/base.html' %}

{% block content %}
    <div class="centro">
        <h1>Criar conta</h1>
        <div class="cartao formulario">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="botao">Cadastrar</button>
            </form>
            <p class="rodape-formulario">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
        </div>
    </div>
{% endblock %}
